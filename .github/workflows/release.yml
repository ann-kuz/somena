name: Сборка и релиз APK

# Стабильная раздача (спека 0012, дополнение про РФ): агент пуши тег v<версия>
# по просьбе владелицы перевести сборку в стабильные; GitHub собирает тот же
# debug-APK (JDK 17, Gradle 8.11.1 - как scripts/build-apk.sh на сервере) и
# выкладывает релиз с файлом somena.apk. Постоянная ссылка на последнюю
# стабильную: releases/latest/download/somena.apk
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon --console=plain :app:assembleDebug
      - run: mv app/build/outputs/apk/debug/app-debug.apk somena.apk
      - uses: softprops/action-gh-release@v2
        with:
          name: Somena ${{ github.ref_name }}
          body: Стабильная сборка ${{ github.ref_name }}. Описание и инструкция: https://ann-kuz.github.io/somena/
          files: somena.apk
