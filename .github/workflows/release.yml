name: Релиз APK (зеркало стабильной)

# Стабильная раздача (спека 0012, дополнение про подпись): связка
# «promote-apk.sh + пуш тега v<версия>» сначала обновляет стабильный APK на
# домене, затем агент пушит тег; GitHub прикладывает к релизу тот же серверный
# APK с домена. Раннер свой APK не собирает: у ephemeral-раннера свой случайный
# debug-ключ на каждый запуск, и APK с зеркала не вставал поверх версий
# с домена - Андроид отвечал «пакет повреждён». Постоянная ссылка последней
# стабильной: releases/latest/download/somena.apk
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Стабильный APK с домена (тот же файл, что и основная ссылка)
        run: |
          curl -fL --retry 3 https://elunaris-vitrail.strangled.net/apk/somena.apk -o somena.apk
          [ "$(head -c 2 somena.apk)" = "PK" ] || { echo 'скачался не APK (нет zip-заголовка)'; exit 1; }
          [ "$(stat -c%s somena.apk)" -ge 10000000 ] || { echo 'APK подозрительно мал'; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          name: Somena ${{ github.ref_name }}
          body: "Стабильная сборка ${{ github.ref_name }}. Описание и инструкция на сайте: https://ann-kuz.github.io/somena/"
          files: somena.apk
